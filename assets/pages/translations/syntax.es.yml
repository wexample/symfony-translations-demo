page_title: 'Sintaxis de traducción'
page_icon: 'ph:bold/brackets-curly'
cache:
  title: Caché
  body: 'Los archivos de traducción se resuelven y se almacenan en caché para preservar el rendimiento.'
domains:
  title: 'Dominios de traducción'
  body: 'Los atajos permiten acceder a traducciones relativas a ciertos contextos.'
  context:
    layout: 'Relativo al diseño (metaetiquetas HTML y marco de la página principal)'
    page: 'Relativo a la página (cuerpo de la página o modal por ejemplo)'
extends:
  title: Extensiones
  body: |
    Si la mayoría de las claves en un archivo son las mismas que en otro, es más simple usar la sintaxis <b>~extends</b> para reutilizar todas las claves y solo agregar las nuevas.
includes:
  title: Inclusiones
  body: |
    Es importante reducir el texto duplicado en un archivo de traducción. Las claves mágicas permiten inclusiones de un archivo a otro utilizando la sintaxis interna <b>@folder.file::key.sub_key</b>. <br><br>Puedes combinarlo con la palabra clave <b>%</b> si la clave o árbol de claves es el mismo.
javascript:
  title: Javascript
  body: 'Las traducciones se pueden pasar a Javascript para uso dinámico.'
  demo_text: '¡Hola Javascript!'
  test_button: 'Prueba aquí'
