page_title: ไวยากรณ์การแปล
page_icon: 'ph:bold/brackets-curly'
cache:
  title: การเก็บข้อมูล
  body: ไฟล์การแปลจะถูกแก้ไขและเก็บข้อมูลเพื่อรักษาประสิทธิภาพการทำงาน.
domains:
  title: โดเมนการแปล
  body: ทางลัดช่วยให้เข้าถึงการแปลที่เกี่ยวข้องกับบริบทบางอย่าง.
  context:
    layout: 'เกี่ยวกับเลย์เอาต์ (แท็กเมตา HTML และกรอบหน้าหลัก)'
    page: 'เกี่ยวกับหน้า (เนื้อหาของหน้า หรือโมดัลตัวอย่าง)'
extends:
  title: ส่วนขยาย
  body: |
    หากกุญแจส่วนใหญ่ในไฟล์เหมือนกับอีกไฟล์หนึ่ง การใช้ไวยากรณ์ <b>~extends</b> จะช่วยให้สามารถนำกุญแจทั้งหมดมาใช้ซ้ำและเพียงแค่เพิ่มกุญแจใหม่ได้ง่ายขึ้น.
includes:
  title: การรวม
  body: |
    สิ่งสำคัญคือต้องลดข้อความที่ซ้ำกันในไฟล์การแปล กุญแจเวทย์ช่วยให้สามารถรวมจากไฟล์หนึ่งไปยังอีกไฟล์หนึ่งโดยใช้ไวยากรณ์ภายใน <b>@folder.file::key.sub_key</b>. <br><br>คุณสามารถรวมกับคำสำคัญ <b>%</b> หากกุญแจหรือโครงสร้างกุญแจเหมือนกัน.
javascript:
  title: Javascript
  body: 'การแปลสามารถถูกส่งไปยัง Javascript เพื่อการใช้งานที่มีพลศาสตร์.'
  demo_text: 'สวัสดี Javascript!'
  test_button: ทดสอบที่นี่
