extends:
  title: Uzantılar
  body: |
    Bir dosyadaki anahtarların çoğu başka bir dosyayla aynıysa, tüm anahtarları yeniden kullanmak ve yalnızca yeni olanları eklemek için <b>~extends</b> sözdizimini kullanmak daha basittir.
includes:
  title: 'Dahil etmeler'
  body: |
    Bir çeviri dosyasında tekrar eden metni azaltmak önemlidir. Sihirli anahtarlar, bir dosyadan diğerine dahil etmeler yapmaya olanak tanır; iç sözdizimi <b>@folder.file::key.sub_key</b> kullanılır. <br><br> Eğer anahtar veya anahtar ağacı aynıysa, <b>%</b> anahtar kelimesi ile birleştirebilirsiniz.
javascript:
  title: Javascript
  body: "Çeviriler dinamik kullanım için Javascript'e aktarılabilir."
  demo_text: 'Merhaba Javascript!'
  test_button: 'Burada Test Et'
