extends:
  title: הרחבות
  body: |
    אם רוב המפתחות בקובץ זהים לאחרים, פשוט יותר להשתמש בתחביר <b>~extends</b> כדי לשחזר את כל המפתחות ולהוסיף רק את החדשים.
includes:
  title: כללות
  body: |
    חשוב להפחית טקסט כפול בקובץ תרגום. מפתחות קסם מאפשרים הכללות מקובץ אחד לאחר באמצעות התחביר הפנימי <b>@folder.file::key.sub_key</b>. <br><br>ניתן לשלב זאת עם המילה המפתח <b>%</b> אם המפתח או עץ המפתחות זהים.
