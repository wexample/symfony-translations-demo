page_title: 'अनुवाद सिंटैक्स'
page_icon: 'ph:bold/brackets-curly'
cache:
  title: कैशिंग
  body: 'अनुवाद फ़ाइलों को हल किया जाता है और प्रदर्शन को बनाए रखने के लिए कैश किया जाता है।'
domains:
  title: 'अनुवाद डोमेन'
  body: 'शॉर्टकट्स कुछ संदर्भों के सापेक्ष अनुवादों तक पहुंच प्रदान करते हैं।'
  context:
    layout: 'लेआउट के सापेक्ष (एचटीएमएल मेटा टैग और मुख्य पृष्ठ फ्रेम)'
    page: 'पृष्ठ के सापेक्ष (पृष्ठ शरीर या मोडल उदाहरण के लिए)'
extends:
  title: एक्सटेंशन
  body: |
    यदि किसी फ़ाइल में अधिकांश कुंजी किसी अन्य के समान हैं, तो सभी कुंजियाँ पुन: उपयोग करने के लिए <b>~extends</b> सिंटैक्स का उपयोग करना सरल है और केवल नई जोड़ना।
includes:
  title: 'शामिल करना'
  body: |
    अनुवाद फ़ाइल में डुप्लिकेट टेक्स्ट को कम करना महत्वपूर्ण है। जादुई कुंजियाँ एक फ़ाइल से दूसरी फ़ाइल में शामिल करने की अनुमति देती हैं, आंतरिक सिंटैक्स <b>@folder.file::key.sub_key</b> का उपयोग करके। <br><br>यदि कुंजी या कुंजी वृक्ष समान है तो आप इसे <b>%</b> कीवर्ड के साथ संयोजित कर सकते हैं।
javascript:
  title: जावास्क्रिप्ट
  body: 'अनुवादों को गतिशील उपयोग के लिए जावास्क्रिप्ट में पास किया जा सकता है।'
  demo_text: 'नमस्ते जावास्क्रिप्ट!'
  test_button: 'यहाँ परीक्षण करें'
