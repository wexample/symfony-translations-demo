cache:
  title: کیشنگ
  body: 'کارکردگی کو برقرار رکھنے کے لیے ترجمے کی فائلیں حل کی جاتی ہیں اور کیش کی جاتی ہیں۔'
domains:
  title: 'ترجمے کے ڈومینز'
  body: 'شارٹ کٹس مخصوص سیاق و سباق کے لحاظ سے ترجموں تک رسائی فراہم کرتے ہیں۔'
  context:
    layout: 'لے آؤٹ کے لحاظ سے (HTML میٹا ٹیگ اور مرکزی صفحہ فریم)'
    page: 'صفحے کے لحاظ سے (صفحے کا مواد یا ماڈل کی مثال کے طور پر)'
extends:
  title: توسیعات
  body: |
    اگر کسی فائل میں زیادہ تر چابیاں دوسری کے ساتھ ایک جیسی ہیں تو <b>~extends</b> ترکیب کا استعمال کرکے تمام چابیوں کو دوبارہ استعمال کرنا اور صرف نئی چابیاں شامل کرنا آسان ہے۔
includes:
  title: 'شامل کرنا'
  body: |
    ترجمے کی فائل میں دہرائی جانے والے متن کو کم کرنا اہم ہے۔ جادوئی چابیاں ایک فائل سے دوسری میں شامل کرنے کی اجازت دیتی ہیں، اندرونی ترکیب <b>@folder.file::key.sub_key</b> کا استعمال کرتے ہوئے۔ <br><br>اگر چابی یا چابی کا درخت ایک جیسا ہو تو آپ اسے <b>%</b> کلیدی لفظ کے ساتھ ملا سکتے ہیں۔
javascript:
  title: 'جاوا اسکرپٹ'
  body: 'ترجمے کو متحرک استعمال کے لیے جاوا اسکرپٹ میں منتقل کیا جا سکتا ہے۔'
  demo_text: 'ہیلو جاوا اسکرپٹ!'
  test_button: 'یہاں جانچیں'
