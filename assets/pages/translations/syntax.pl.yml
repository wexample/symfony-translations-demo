page_title: 'Składnia tłumaczeń'
page_icon: 'ph:bold/brackets-curly'
cache:
  title: Buforowanie
  body: 'Pliki tłumaczeń są rozwiązywane i buforowane w celu zachowania wydajności.'
domains:
  title: 'Domeny tłumaczeń'
  body: 'Skróty umożliwiają dostęp do tłumaczeń w określonych kontekstach.'
  context:
    layout: 'W odniesieniu do układu (tagi meta HTML i główny szkielet strony)'
    page: 'W odniesieniu do strony (treść strony lub modal, na przykład)'
extends:
  title: Rozszerzenia
  body: |
    Jeśli większość kluczy w pliku jest taka sama jak w innym, łatwiej jest użyć składni <b>~extends</b>, aby ponownie wykorzystać wszystkie klucze i tylko dodać nowe.
includes:
  title: Inkluzje
  body: |
    Ważne jest, aby zredukować powielony tekst w pliku tłumaczeń. Klucze magiczne pozwalają na inkluzje z jednego pliku do drugiego, używając wewnętrznej składni <b>@folder.file::key.sub_key</b>. <br><br>Możesz połączyć to z kluczem <b>%</b>, jeśli klucz lub struktura kluczy są takie same.
javascript:
  title: Javascript
  body: 'Tłumaczenia mogą być przekazywane do Javascriptu do dynamicznego użycia.'
  demo_text: 'Witaj Javascript!'
  test_button: 'Przetestuj tutaj'
