page_title: 'Синтаксис перевода'
page_icon: 'ph:bold/brackets-curly'
cache:
  title: Кэширование
  body: 'Файлы перевода обрабатываются и кэшируются для повышения производительности.'
domains:
  title: 'Домены перевода'
  body: 'Сокращения позволяют получать доступ к переводам относительно определённых контекстов.'
  context:
    layout: 'Относительно макета (HTML метатеги и основной фрейм страницы)'
    page: 'Относительно страницы (например, тело страницы или модальное окно)'
extends:
  title: Расширения
  body: |
    Если большинство ключей в файле совпадает с другими, проще использовать синтаксис <b>~extends</b>, чтобы повторно использовать все ключи и добавить только новые.
includes:
  title: Включения
  body: |
    Важно уменьшить количество дублирующегося текста в файле перевода. Магические ключи позволяют включения из одного файла в другой, используя внутренний синтаксис <b>@folder.file::key.sub_key</b>. <br><br>Вы можете комбинировать это с ключевым словом <b>%</b>, если ключ или дерево ключей совпадают.
javascript:
  title: Javascript
  body: 'Переводы могут быть переданы в Javascript для динамического использования.'
  demo_text: 'Привет, Javascript!'
  test_button: 'Протестировать здесь'
