page_title: 翻译语法
page_icon: 'ph:bold/brackets-curly'
cache:
  title: 缓存
  body: 翻译文件被解析并缓存以保持性能。
domains:
  title: 翻译域
  body: 快捷方式可以访问相对于某些上下文的翻译。
  context:
    layout: 相对于布局（HTML元标签和主页面框架）
    page: 相对于页面（例如页面主体或模态）
extends:
  title: 扩展
  body: |
    如果文件中的大多数键与另一个相同，使用<b>~extends</b>语法重用所有键并仅添加新键会更简单。
includes:
  title: 包含
  body: |
    减少翻译文件中的重复文本很重要。魔法键允许使用内部语法<b>@folder.file::key.sub_key</b>从一个文件包含到另一个文件。 <br><br>如果键或键树相同，您可以将其与<b>%</b>关键字结合使用。
javascript:
  title: Javascript
  body: 翻译可以传递给Javascript以供动态使用。
  demo_text: 你好Javascript！
  test_button: 在这里测试
