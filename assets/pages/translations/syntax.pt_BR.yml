page_title: 'Sintaxe de tradução'
page_icon: 'ph:bold/brackets-curly'
cache:
  title: Cache
  body: 'Arquivos de tradução são resolvidos e armazenados em cache para preservar o desempenho.'
domains:
  title: 'Domínios de tradução'
  body: 'Atalhos permitem acessar traduções relativas a certos contextos.'
  context:
    layout: 'Relativo ao layout (meta tags HTML e estrutura principal da página)'
    page: 'Relativo à página (corpo da página ou modal, por exemplo)'
extends:
  title: Extensões
  body: |
    Se a maioria das chaves em um arquivo forem as mesmas de outro, é mais simples usar a sintaxe <b>~extends</b> para reutilizar todas as chaves e apenas adicionar as novas.
includes:
  title: Inclusões
  body: |
    É importante reduzir texto duplicado em um arquivo de tradução. Chaves mágicas permitem inclusões de um arquivo para outro usando a sintaxe interna <b>@folder.file::key.sub_key</b>. <br><br>Você pode combiná-la com a palavra-chave <b>%</b> se a chave ou a árvore de chaves for a mesma.
javascript:
  title: Javascript
  body: 'Traduções podem ser passadas para o Javascript para uso dinâmico.'
  demo_text: 'Olá Javascript!'
  test_button: 'Teste aqui'
