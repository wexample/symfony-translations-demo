domains:
  title: Käännösalueet
  body: 'Pikanäppäimet mahdollistavat pääsyn käännöksiin tietyistä konteksteista.'
  context:
    layout: 'Suhteessa asetteluun (HTML-meta-tagit ja pääsivun kehys)'
    page: 'Suhteessa sivuun (sivun sisältö tai modaalinen ikkuna esimerkiksi)'
extends:
  title: Laajennukset
  body: |
    Jos useimmat avaimet tiedostossa ovat samoja kuin toisessa, on helpompaa käyttää <b>~extends</b> -syntaksia kaikkien avaimien uudelleenkäyttämiseen ja vain uusien lisäämiseen.
includes:
  title: Sisällytykset
  body: |
    On tärkeää vähentää päällekkäistä tekstiä käännöstiedostossa. Taikavälineet mahdollistavat sisällytykset yhdestä tiedostosta toiseen käyttäen sisäistä syntaksia <b>@folder.file::key.sub_key</b>. <br><br>Voit yhdistää sen <b>%</b> -avaimeen, jos avain tai avainpuu on sama.
javascript:
  title: Javascript
  body: 'Käännöksiä voidaan siirtää Javascriptille dynaamista käyttöä varten.'
  demo_text: 'Hei Javascript!'
  test_button: 'Testaa täällä'
