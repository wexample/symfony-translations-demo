cache:
  title: Caching
  body: 'I file di traduzione vengono risolti e memorizzati nella cache per preservare le prestazioni.'
domains:
  title: 'Domini di traduzione'
  body: 'Le scorciatoie consentono di accedere alle traduzioni relative a determinati contesti.'
  context:
    layout: 'Relativo al layout (meta tag HTML e frame principale della pagina)'
    page: 'Relativo alla pagina (corpo della pagina o modale, ad esempio)'
extends:
  title: Estensioni
  body: |
    Se la maggior parte delle chiavi in un file sono le stesse di un altro, è più semplice usare la sintassi <b>~extends</b> per riutilizzare tutte le chiavi e aggiungere solo quelle nuove.
includes:
  title: Inclusioni
  body: |
    È importante ridurre il testo duplicato in un file di traduzione. Le chiavi magiche consentono inclusioni da un file a un altro utilizzando la sintassi interna <b>@folder.file::key.sub_key</b>. <br><br>Puoi combinarlo con la parola chiave <b>%</b> se la chiave o l'albero delle chiavi è lo stesso.
javascript:
  title: Javascript
  body: 'Le traduzioni possono essere passate a Javascript per un uso dinamico.'
  demo_text: 'Ciao Javascript!'
  test_button: 'Testa qui'
