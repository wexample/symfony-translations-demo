  body: 'فایل‌های ترجمه حل و کش می‌شوند تا عملکرد حفظ شود.'
domains:
  title: 'دامنه‌های ترجمه'
  body: 'میانبرها دسترسی به ترجمه‌ها را نسبت به زمینه‌های خاص فراهم می‌کنند.'
  context:
    layout: 'نسبت به طرح (تگ‌های متا HTML و فریم صفحه اصلی)'
    page: 'نسبت به صفحه (بدنه صفحه یا مدال به عنوان مثال)'
extends:
  title: گسترش‌ها
  body: |
    اگر اکثر کلیدها در یک فایل مشابه دیگری باشند، ساده‌تر است از نحو <b>~extends</b> برای استفاده مجدد از تمام کلیدها و فقط افزودن کلیدهای جدید استفاده کنید.
includes:
  title: گنجاندن‌ها
  body: |
    کاهش متن تکراری در یک فایل ترجمه مهم است. کلیدهای جادویی امکان گنجاندن از یک فایل به فایل دیگر را با استفاده از نحو داخلی <b>@folder.file::key.sub_key</b> فراهم می‌کنند. <br><br>شما می‌توانید آن را با کلید <b>%</b> ترکیب کنید اگر کلید یا درخت کلید یکسان باشد.
javascript:
  title: 'جاوا اسکریپت'
  body: 'ترجمه‌ها می‌توانند به جاوا اسکریپت برای استفاده دینامیک منتقل شوند.'
  demo_text: 'سلام جاوا اسکریپت!'
  test_button: 'اینجا آزمایش کنید'
