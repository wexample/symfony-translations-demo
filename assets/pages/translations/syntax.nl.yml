page_title: Vertalingsyntaxis
page_icon: 'ph:bold/brackets-curly'
cache:
  title: Caching
  body: 'Vertalingsbestanden worden opgelost en gecached om de prestaties te behouden.'
domains:
  title: Vertaalgebieden
  body: 'Sneltoetsen bieden toegang tot vertalingen in relatie tot bepaalde contexten.'
  context:
    layout: 'Relatief aan de lay-out (HTML meta-tags en hoofdpaginaframe)'
    page: 'Relatief aan de pagina (bijvoorbeeld de paginainhoud of een venster)'
extends:
  title: Uitbreidingen
  body: |
    Als de meeste sleutels in een bestand hetzelfde zijn als in een ander, is het eenvoudiger om de <b>~extends</b> syntaxis te gebruiken om alle sleutels opnieuw te gebruiken en alleen de nieuwe toe te voegen.
includes:
  title: Inclusies
  body: |
    Het is belangrijk om duplicaattekst in een vertaalbestand te verminderen. Magische sleutels maken inclusies van het ene bestand naar het andere mogelijk met de interne syntaxis <b>@folder.file::key.sub_key</b>. <br><br>Je kunt het combineren met het <b>%</b> sleutelwoord als de sleutel of sleutelboom hetzelfde is.
javascript:
  title: Javascript
  body: 'Vertalingen kunnen naar Javascript worden doorgegeven voor dynamisch gebruik.'
  demo_text: 'Hallo Javascript!'
  test_button: 'Test hier'
