page_title: 'অনুবাদের সিনট্যাক্স'
page_icon: 'ph:bold/brackets-curly'
cache:
  title: ক্যাশিং
  body: 'অনুবাদ ফাইলগুলি সমাধান করা হয় এবং পারফরম্যান্স রক্ষার জন্য ক্যাশে করা হয়।'
domains:
  title: 'অনুবাদ ডোমেইনস'
  body: 'শর্টকাটগুলি নির্দিষ্ট প্রসঙ্গের সাথে সম্পর্কিত অনুবাদগুলিতে প্রবেশের অনুমতি দেয়।'
  context:
    layout: 'লেআউটের সাথে সম্পর্কিত (এইচটিএমএল মেটা ট্যাগ এবং মূল পৃষ্ঠা ফ্রেম)'
    page: 'পৃষ্ঠার সাথে সম্পর্কিত (পৃষ্ঠা শরীর বা মডাল উদাহরণস্বরূপ)'
extends:
  title: এক্সটেনশন
  body: |
    যদি একটি ফাইলে বেশিরভাগ কী অন্যটির মতো হয়, তবে সমস্ত কী পুনরায় ব্যবহার করতে এবং কেবল নতুনগুলি যোগ করতে <b>~extends</b> সিনট্যাক্স ব্যবহার করা সহজ।
includes:
  title: ইনক্লুশনস
  body: |
    একটি অনুবাদ ফাইলে ডুপ্লিকেট টেক্সট কমানো গুরুত্বপূর্ণ। ম্যাজিক কী এক ফাইল থেকে অন্য ফাইলে অন্তর্ভুক্তির জন্য অভ্যন্তরীণ সিনট্যাক্স <b>@folder.file::key.sub_key</b> ব্যবহার করতে দেয়। <br><br>যদি কী বা কী গাছ একই হয় তবে এটি <b>%</b> কীওয়ার্ডের সাথে সংমিশ্রণ করা যেতে পারে।
javascript:
  title: জাভাস্ক্রিপ্ট
  body: 'অনুবাদগুলি গতিশীল ব্যবহারের জন্য জাভাস্ক্রিপ্টে পাঠানো যেতে পারে।'
  demo_text: 'হ্যালো জাভাস্ক্রিপ্ট!'
  test_button: 'এখানে পরীক্ষা করুন'
