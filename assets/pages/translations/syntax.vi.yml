page_title: 'Cú pháp dịch'
page_icon: 'ph:bold/brackets-curly'
cache:
  title: 'Lưu cache'
  body: 'Các tệp dịch được giải quyết và lưu cache để bảo tồn hiệu suất.'
domains:
  title: 'Miền dịch'
  body: 'Các phím tắt cho phép truy cập vào các bản dịch liên quan đến một số ngữ cảnh nhất định.'
  context:
    layout: 'Liên quan đến bố cục (thẻ meta HTML và khung trang chính)'
    page: 'Liên quan đến trang (nội dung trang hoặc hộp thoại chẳng hạn)'
extends:
  title: 'Mở rộng'
  body: |
    Nếu hầu hết các khóa trong một tệp giống với một tệp khác, thì đơn giản hơn khi sử dụng cú pháp <b>~extends</b> để tái sử dụng tất cả các khóa và chỉ thêm những khóa mới.
includes:
  title: 'Bao gồm'
  body: |
    Điều quan trọng là giảm thiểu văn bản trùng lặp trong một tệp dịch. Các khóa ma thuật cho phép bao gồm từ tệp này sang tệp khác bằng cách sử dụng cú pháp nội bộ <b>@folder.file::key.sub_key</b>. <br><br>Bạn có thể kết hợp nó với từ khóa <b>%</b> nếu khóa hoặc cây khóa giống nhau.
javascript:
  title: Javascript
  body: 'Các bản dịch có thể được truyền vào Javascript để sử dụng động.'
  demo_text: 'Xin chào Javascript!'
  test_button: 'Kiểm tra ở đây'
