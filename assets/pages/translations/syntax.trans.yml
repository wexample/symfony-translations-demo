      page: 'نسبت به صفحه (بدنه صفحه یا مدال به عنوان مثال)'
  extends:
    title: گسترش‌ها
    body: |
      اگر اکثر کلیدها در یک فایل مشابه دیگری باشند، ساده‌تر است از نحو <b>~extends</b> برای استفاده مجدد از تمام کلیدها و فقط افزودن کلیدهای جدید استفاده کنید.
