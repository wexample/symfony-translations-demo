      On tärkeää vähentää päällekkäistä tekstiä käännöstiedostossa. Taikavälineet mahdollistavat sisällytykset yhdestä tiedostosta toiseen käyttäen sisäistä syntaksia <b>@folder.file::key.sub_key</b>. <br><br>Voit yhdistää sen <b>%</b> -avaimeen, jos avain tai avainpuu on sama.
  javascript:
    title: Javascript
    body: 'Käännöksiä voidaan siirtää Javascriptille dynaamista käyttöä varten.'
    demo_text: 'Hei Javascript!'
    test_button: 'Testaa täällä'

fr:
  page_title: 'Syntaxe des traductions'
  page_icon: 'ph:bold/brackets-curly'
