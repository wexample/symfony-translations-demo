en:
  page_title: Translation syntax
  page_icon: ph:bold/brackets-curly

  cache:
    title: Caching
    body: Translation files are resolved and cached to preserve performance.

  domains:
    title: Translation domains
    body: Shortcuts allow access to translations relative to certain contexts.
    context:
      layout: Relative to the layout (HTML meta tags and main page frame)
      page: Relative to the page (page body or modal for example)

  extends:
    title: Extensions
    body: >
      If most keys in a file are the same as another, it is simpler to use the <b>~extends</b>
      syntax to reuse all keys and only add the new ones.

  includes:
    title: Inclusions
    body: >
      It is important to reduce duplicate text in a translation file. Magic keys allow inclusions
      from one file to another using the internal syntax <b>@folder.file::key.sub_key</b>.
      <br><br>You can combine it with the <b>%</b> keyword if the key or key tree is the same.

  javascript:
    title: Javascript
    body: Translations can be passed to Javascript for dynamic use.
    demo_text: Hello Javascript!
    test_button: Test here

ar:
  page_title: 'بنية الترجمة'
  page_icon: 'ph:bold/brackets-curly'
  cache:
    title: 'التخزين المؤقت'
    body: 'يتم حل ملفات الترجمة وتخزينها مؤقتاً للحفاظ على الأداء.'
  domains:
    title: 'مجالات الترجمة'
    body: 'تسمح الاختصارات بالوصول إلى الترجمات بالنسبة لسياقات معينة.'
    context:
      layout: 'بالنسبة للتخطيط (علامات ميتا HTML وإطار الصفحة الرئيسية)'
      page: 'بالنسبة للصفحة (نص الصفحة أو نافذة منبثقة على سبيل المثال)'
  extends:
    title: الامتدادات
    body: |
      إذا كانت معظم المفاتيح في ملف ما هي نفسها كما في ملف آخر، فمن الأسهل استخدام بناء <b>~extends</b> لإعادة استخدام جميع المفاتيح وإضافة المفاتيح الجديدة فقط.
  includes:
    title: الإدراجات
    body: |
      من المهم تقليل النصوص المكررة في ملف الترجمة. تسمح المفاتيح السحرية بالإدراج من ملف إلى آخر باستخدام البنية الداخلية <b>@folder.file::key.sub_key</b>. <br><br>يمكنك دمجها مع الكلمة المفتاحية <b>%</b> إذا كانت المفتاح أو شجرة المفاتيح هي نفسها.
  javascript:
    title: 'جافا سكريبت'
    body: 'يمكن تمرير الترجمات إلى جافا سكريبت للاستخدام الديناميكي.'
    demo_text: 'مرحبًا جافا سكريبت!'
    test_button: 'اختبر هنا'

bn:
  page_title: 'অনুবাদের সিনট্যাক্স'
