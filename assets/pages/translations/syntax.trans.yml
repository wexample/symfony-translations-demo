hi:
  page_title: 'अनुवाद सिंटैक्स'
  page_icon: 'ph:bold/brackets-curly'
  cache:
    title: कैशिंग
    body: 'अनुवाद फ़ाइलों को हल किया जाता है और प्रदर्शन को बनाए रखने के लिए कैश किया जाता है।'
  domains:
    title: 'अनुवाद डोमेन'
    body: 'शॉर्टकट्स कुछ संदर्भों के सापेक्ष अनुवादों तक पहुंच प्रदान करते हैं।'
    context:
      layout: 'लेआउट के सापेक्ष (एचटीएमएल मेटा टैग और मुख्य पृष्ठ फ्रेम)'
      page: 'पृष्ठ के सापेक्ष (पृष्ठ शरीर या मोडल उदाहरण के लिए)'
  extends:
    title: एक्सटेंशन
    body: |
      यदि किसी फ़ाइल में अधिकांश कुंजी किसी अन्य के समान हैं, तो सभी कुंजियाँ पुन: उपयोग करने के लिए <b>~extends</b> सिंटैक्स का उपयोग करना सरल है और केवल नई जोड़ना।
  includes:
    title: 'शामिल करना'
    body: |
      अनुवाद फ़ाइल में डुप्लिकेट टेक्स्ट को कम करना महत्वपूर्ण है। जादुई कुंजियाँ एक फ़ाइल से दूसरी फ़ाइल में शामिल करने की अनुमति देती हैं, आंतरिक सिंटैक्स <b>@folder.file::key.sub_key</b> का उपयोग करके। <br><br>यदि कुंजी या कुंजी वृक्ष समान है तो आप इसे <b>%</b> कीवर्ड के साथ संयोजित कर सकते हैं।
  javascript:
    title: जावास्क्रिप्ट
    body: 'अनुवादों को गतिशील उपयोग के लिए जावास्क्रिप्ट में पास किया जा सकता है।'
    demo_text: 'नमस्ते जावास्क्रिप्ट!'
    test_button: 'यहाँ परीक्षण करें'

id:
  page_title: 'Sintaksis terjemahan'
  page_icon: 'ph:bold/brackets-curly'
  cache:
    title: Caching
    body: 'File terjemahan diselesaikan dan disimpan untuk menjaga kinerja.'
  domains:
    title: 'Domain terjemahan'
    body: 'Shortcut memungkinkan akses ke terjemahan yang terkait dengan konteks tertentu.'
    context:
      layout: 'Terkait dengan layout (tag meta HTML dan kerangka halaman utama)'
      page: 'Terkait dengan halaman (badan halaman atau modal misalnya)'
  extends:
    title: Ekstensi
    body: |
      Jika sebagian besar kunci dalam sebuah file sama dengan yang lain, lebih sederhana untuk menggunakan sintaksis <b>~extends</b> untuk menggunakan kembali semua kunci dan hanya menambahkan yang baru.
  includes:
    title: Inklusi
    body: |
      Penting untuk mengurangi teks duplikat dalam file terjemahan. Kunci ajaib memungkinkan inklusi dari satu file ke file lain menggunakan sintaks internal <b>@folder.file::key.sub_key</b>. <br><br>Anda dapat menggabungkannya dengan kata kunci <b>%</b> jika kunci atau pohon kunci adalah sama.
  javascript:
    title: Javascript
    body: 'Terjemahan dapat diteruskan ke Javascript untuk penggunaan dinamis.'
    demo_text: 'Halo Javascript!'
    test_button: 'Uji di sini'

it:
  page_title: 'Sintassi della traduzione'
  page_icon: 'ph:bold/brackets-curly'
  cache:
    title: Caching
    body: 'I file di traduzione vengono risolti e memorizzati nella cache per preservare le prestazioni.'
  domains:
    title: 'Domini di traduzione'
    body: 'Le scorciatoie consentono di accedere alle traduzioni relative a determinati contesti.'
    context:
      layout: 'Relativo al layout (meta tag HTML e frame principale della pagina)'
      page: 'Relativo alla pagina (corpo della pagina o modale, ad esempio)'
  extends:
    title: Estensioni
    body: |
      Se la maggior parte delle chiavi in un file sono le stesse di un altro, è più semplice usare la sintassi <b>~extends</b> per riutilizzare tutte le chiavi e aggiungere solo quelle nuove.
  includes:
    title: Inclusioni
    body: |
      È importante ridurre il testo duplicato in un file di traduzione. Le chiavi magiche consentono inclusioni da un file a un altro utilizzando la sintassi interna <b>@folder.file::key.sub_key</b>. <br><br>Puoi combinarlo con la parola chiave <b>%</b> se la chiave o l'albero delle chiavi è lo stesso.
  javascript:
