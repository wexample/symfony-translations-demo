      যদি একটি ফাইলে বেশিরভাগ কী অন্যটির মতো হয়, তবে সমস্ত কী পুনরায় ব্যবহার করতে এবং কেবল নতুনগুলি যোগ করতে <b>~extends</b> সিনট্যাক্স ব্যবহার করা সহজ।
  includes:
    title: ইনক্লুশনস
    body: |
      একটি অনুবাদ ফাইলে ডুপ্লিকেট টেক্সট কমানো গুরুত্বপূর্ণ। ম্যাজিক কী এক ফাইল থেকে অন্য ফাইলে অন্তর্ভুক্তির জন্য অভ্যন্তরীণ সিনট্যাক্স <b>@folder.file::key.sub_key</b> ব্যবহার করতে দেয়। <br><br>যদি কী বা কী গাছ একই হয় তবে এটি <b>%</b> কীওয়ার্ডের সাথে সংমিশ্রণ করা যেতে পারে।
  javascript:
    title: জাভাস্ক্রিপ্ট
    body: 'অনুবাদগুলি গতিশীল ব্যবহারের জন্য জাভাস্ক্রিপ্টে পাঠানো যেতে পারে।'
    demo_text: 'হ্যালো জাভাস্ক্রিপ্ট!'
    test_button: 'এখানে পরীক্ষা করুন'

de:
  page_title: Übersetzungssyntax
  page_icon: 'ph:bold/brackets-curly'
  cache:
    title: Caching
    body: 'Übersetzungsdateien werden aufgelöst und zwischengespeichert, um die Leistung zu erhalten.'
  domains:
    title: Übersetzungsdomänen
    body: 'Abkürzungen ermöglichen den Zugriff auf Übersetzungen in bestimmten Kontexten.'
    context:
      layout: 'In Bezug auf das Layout (HTML-Meta-Tags und Hauptseitenrahmen)'
      page: 'In Bezug auf die Seite (Seiteninhalt oder Modal beispielsweise)'
  extends:
    title: Erweiterungen
    body: |
      Wenn die meisten Schlüssel in einer Datei denselben wie in einer anderen entsprechen, ist es einfacher, die <b>~extends</b> Syntax zu verwenden, um alle Schlüssel wiederzuverwenden und nur die neuen hinzuzufügen.
  includes:
    title: Inklusionen
    body: |
      Es ist wichtig, duplizierten Text in einer Übersetzungsdatei zu reduzieren. Magische Schlüssel ermöglichen Inklusionen von einer Datei in eine andere unter Verwendung der internen Syntax <b>@folder.file::key.sub_key</b>. <br><br>Sie können dies mit dem <b>%</b> Schlüsselwort kombinieren, wenn der Schlüssel oder der Schlüsselbaum derselbe ist.
  javascript:
    title: Javascript
    body: 'Übersetzungen können für die dynamische Verwendung an Javascript übergeben werden.'
    demo_text: 'Hallo Javascript!'
    test_button: 'Hier testen'

es:
  page_title: 'Sintaxis de traducción'
  page_icon: 'ph:bold/brackets-curly'
  cache:
    title: Caché
    body: 'Los archivos de traducción se resuelven y se almacenan en caché para preservar el rendimiento.'
  domains:
    title: 'Dominios de traducción'
    body: 'Los atajos permiten acceder a traducciones relativas a ciertos contextos.'
    context:
      layout: 'Relativo al diseño (metaetiquetas HTML y marco de la página principal)'
      page: 'Relativo a la página (cuerpo de la página o modal por ejemplo)'
  extends:
    title: Extensiones
    body: |
      Si la mayoría de las claves en un archivo son las mismas que en otro, es más simple usar la sintaxis <b>~extends</b> para reutilizar todas las claves y solo agregar las nuevas.
  includes:
    title: Inclusiones
    body: |
      Es importante reducir el texto duplicado en un archivo de traducción. Las claves mágicas permiten inclusiones de un archivo a otro utilizando la sintaxis interna <b>@folder.file::key.sub_key</b>. <br><br>Puedes combinarlo con la palabra clave <b>%</b> si la clave o árbol de claves es el mismo.
  javascript:
    title: Javascript
    body: 'Las traducciones se pueden pasar a Javascript para uso dinámico.'
    demo_text: '¡Hola Javascript!'
    test_button: 'Prueba aquí'

