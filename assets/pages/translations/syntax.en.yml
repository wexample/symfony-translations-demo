page_title: Translation syntax
page_icon: ph:bold/brackets-curly

cache:
  title: Caching
  body: Translation files are resolved and cached to preserve performance.

domains:
  title: Translation domains
  body: Shortcuts allow access to translations relative to certain contexts.
  context:
    layout: Relative to the layout (HTML meta tags and main page frame)
    page: Relative to the page (page body or modal for example)

extends:
  title: Extensions
  body: >
    If most keys in a file are the same as another, it is simpler to use the <b>~extends</b>
    syntax to reuse all keys and only add the new ones.

includes:
  title: Inclusions
  body: >
    It is important to reduce duplicate text in a translation file. Magic keys allow inclusions
    from one file to another using the internal syntax <b>@folder.file::key.sub_key</b>.
    <br><br>You can combine it with the <b>%</b> keyword if the key or key tree is the same.

javascript:
  title: Javascript
  body: Translations can be passed to Javascript for dynamic use.
  demo_text: Hello Javascript!
  test_button: Test here
